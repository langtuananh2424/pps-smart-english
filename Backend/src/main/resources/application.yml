spring:
  application:
    name: pps-smart-english
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pps}
    username: ${DB_USER:pps}
    password: ${DB_PASSWORD:pps}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    # DEMO_FLYWAY_LOCATION=",classpath:db/demo" nạp dữ liệu demo; mặc định rỗng (production)
    locations: classpath:db/migration,classpath:db/migration-pg${DEMO_FLYWAY_LOCATION:}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    secret-previous: ${JWT_SECRET_PREVIOUS:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}
  storage:
    enabled: true
    # endpoint nội bộ (backend -> MinIO); public-url là địa chỉ trình duyệt thấy, dùng để ký URL
    endpoint: ${MINIO_ENDPOINT:http://localhost:9100}
    public-url: ${MINIO_PUBLIC_URL:http://localhost:9100}
    access-key: ${MINIO_ACCESS_KEY}
    secret-key: ${MINIO_SECRET_KEY}
    bucket: ${MINIO_BUCKET:pps-media}
  payment:
    # cổng giả để dev/test luồng mua; production để false cho tới khi có cổng thật
    fake-enabled: ${PAYMENT_FAKE_ENABLED:false}
    fake-secret: ${PAYMENT_FAKE_SECRET:}
  commerce:
    order-ttl-minutes: ${ORDER_TTL_MINUTES:30}
  reports:
    # múi giờ tính ngày trong báo cáo Admin
    zone: Asia/Ho_Chi_Minh
    # tỷ giá USD/VND để quy đổi chi phí AI; không có mặc định, để trống thì báo cáo chỉ có USD
    usd-vnd-rate: ${REPORT_USD_VND_RATE:}
  cam:
    # Cam nhắc khóa sắp hết hạn khi còn từng này ngày (D-53)
    expiring-days: 7
  retention:
    # múi giờ tính "ngày có học" cho mọi người dùng (Q-18)
    zone: Asia/Ho_Chi_Minh
    # false để tắt job nhắc streak (test)
    jobs-enabled: true
    xp:
      lesson: 10
      exercise: 10
      high-score: 10
      high-score-percent: 80
    titles:
      - name: Tập sự
        min-xp: 0
      - name: Tự tin
        min-xp: 500
      - name: Chuyên gia
        min-xp: 2000
    push:
      # server POST vào endpoint của trình duyệt nên chỉ nhận các host này (chống SSRF); mục bắt đầu bằng "." là hậu tố
      allowed-hosts:
        - fcm.googleapis.com
        - updates.push.services.mozilla.com
        - .push.apple.com
        - .notify.windows.com
      concurrency: 10
      # thiếu khóa VAPID thì không gửi push, thông báo trong ứng dụng vẫn hoạt động
      vapid-public-key: ${VAPID_PUBLIC_KEY:}
      vapid-private-key: ${VAPID_PRIVATE_KEY:}
      vapid-subject: ${VAPID_SUBJECT:mailto:no-reply@localhost}
  ai:
    # anthropic (thiếu ANTHROPIC_API_KEY thì không khởi động) hoặc fake (kết quả cố định, cho local/test)
    provider: ${AI_PROVIDER:anthropic}
    model: ${AI_MODEL:claude-haiku-5-5}
    api-key: ${ANTHROPIC_API_KEY:}
    max-pending: ${AI_MAX_PENDING:200}
    # false để tách vai api/worker
    worker-enabled: ${AI_WORKER_ENABLED:true}
    concurrency: ${AI_CONCURRENCY:10}
    redis-notify: true
    # USD cho 1 triệu token
    price:
      input: 0.10
      output: 0.50
      cache-read: 0.01
      cache-write: 0.125

  speaking:
    # http (engine thật) hoặc fake (local/test). URL và token chỉ lấy từ cấu hình, không bao giờ từ request.
    engine: ${SPEAKING_ENGINE:http}
    engine-url: ${ENGINE_URL:}
    engine-token: ${ENGINE_TOKEN:}
    # engine dùng chung nên giới hạn số request đồng thời từ backend
    max-concurrent: ${SPEAKING_MAX_CONCURRENT:2}
    connect-timeout: 5s
    read-timeout: 180s
    upload-ttl: 10m
    # upload chưa xác nhận quá hạn + khoảng này thì xóa; audio đã chấm giữ audio-retention-days ngày (D-43)
    expire-after: 1h
    audio-retention-days: 30
    cleanup-enabled: true
    # bản ghi không rõ (D-48): chạm một ngưỡng thì không chấm, hoàn lượt
    unclear:
      min-seconds: 3
      min-words: 5
      min-avg-probability: 0.5
      min-words-per-second: 0.5
    # NGƯỠNG KHỞI ĐIỂM, chưa hiệu chỉnh với giáo viên. Bảng "ngưỡng=band": *-min lấy dòng đầu có số đo >= ngưỡng,
    # pauses-per-min-max lấy dòng đầu có số đo <= ngưỡng. pron-score-max: thang điểm từ của engine (giả định 0..1).
    bands:
      pron-score-max: 1.0
      pron-wrong-below: 0.6
      pause-seconds: 1.0
      pron-min: "0.95=9,0.9=8,0.85=7,0.78=6,0.7=5,0.6=4,0.5=3,0.4=2"
      wpm-min: "140=8,120=7,100=6,80=5,60=4,40=3,20=2"
      pauses-per-min-max: "1=8,2=7,4=6,6=5,8=4,12=3,16=2"
      speech-ratio-min: "0.85=8,0.75=7,0.65=6,0.55=5,0.45=4,0.35=3,0.25=2"

  regrade:
    # chấm lại bài cũ khi Admin sửa đáp án; false để tắt worker (test gọi RegradeRunner.tick() trực tiếp)
    enabled: ${REGRADE_ENABLED:true}
    poll-ms: 2000
    batch-size: 200
    # trần job AI chấm lại đang chạy cùng lúc, để việc của Admin không nuốt hàng đợi của học viên
    max-ai-pending: 20

logging:
  structured:
    format:
      console: ecs

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Redis/mail hỏng không được làm app báo down
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false
    mail:
      enabled: false
