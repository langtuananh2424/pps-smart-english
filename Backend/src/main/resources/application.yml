spring:
  application:
    name: pps-smart-english
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/pps}
    username: ${DB_USER:pps}
    password: ${DB_PASSWORD:pps}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
    locations: classpath:db/migration,classpath:db/migration-pg
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 500ms
      connect-timeout: 500ms
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 5000
      mail.smtp.writetimeout: 5000

app:
  base-url: ${APP_BASE_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET}
    secret-previous: ${JWT_SECRET_PREVIOUS:}
  google:
    client-id: ${GOOGLE_CLIENT_ID:}
  mail:
    from: ${MAIL_FROM:no-reply@localhost}

logging:
  structured:
    format:
      console: ecs

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      group:
        # Redis/mail hỏng không được làm app báo down
        readiness:
          include: readinessState,db
  health:
    redis:
      enabled: false
    mail:
      enabled: false
