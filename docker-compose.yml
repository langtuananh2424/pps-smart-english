services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pps}
      POSTGRES_USER: ${POSTGRES_USER:-pps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pps}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./Backend
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pps}
      DB_USER: ${POSTGRES_USER:-pps}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-pps}
    ports:
      - "8080:8080"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    build: ./Web
    ports:
      - "3000:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
