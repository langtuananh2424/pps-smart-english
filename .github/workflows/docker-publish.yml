name: Docker publish & deploy

# main = staging, production = bản cho người dùng. develop chỉ tích hợp, không build image, không deploy.
on:
  push:
    branches: [main, production]
    paths: ["Backend/**", "Web/**", "docker-compose.prod.yml", ".github/workflows/docker-publish.yml"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  # prod-latest / prod-<sha> cho nhánh production, staging-latest / staging-<sha> cho các nhánh còn lại
  IMAGE_ENV: ${{ github.ref_name == 'production' && 'prod' || 'staging' }}
  DEPLOY_DIR: ${{ github.ref_name == 'production' && 'production' || 'staging' }}

jobs:
  backend-ci:
    uses: ./.github/workflows/backend-ci.yml
  web-ci:
    uses: ./.github/workflows/web-ci.yml

  publish:
    needs: [backend-ci, web-ci]
    # Chạy tay từ nhánh khác không được ghi đè image staging.
    if: github.ref_name == 'main' || github.ref_name == 'production'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { name: backend, context: Backend }
          - { name: web, context: Web }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}/${{ matrix.name }}
          tags: |
            type=raw,value=${{ env.IMAGE_ENV }}-latest
            type=sha,prefix=${{ env.IMAGE_ENV }}-
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  # Chạy trên self-hosted runner đặt ngay trên máy chủ (không có IP tĩnh nên GitHub cloud không SSH vào được).
  # Chỉ job này dùng self-hosted; CI luôn dùng ubuntu-latest vì repo public, không để PR chạy trên máy chủ.
  deploy:
    needs: publish
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: [self-hosted, pps-smart-english]
    environment: ${{ github.ref_name == 'production' && 'production' || 'staging' }}
    permissions:
      contents: read
      packages: read
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Đồng bộ file compose lên máy chủ; thiếu bước này file trên máy chủ sẽ lệch repo.
      - name: Sync compose file
        run: cp docker-compose.prod.yml /opt/pps-smart-english/${{ env.DEPLOY_DIR }}/docker-compose.yml
      - name: Pull and restart
        working-directory: /opt/pps-smart-english/${{ env.DEPLOY_DIR }}
        run: |
          docker compose pull
          docker compose up -d
          docker image prune -f
