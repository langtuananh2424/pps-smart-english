name: Web CI

on:
  push:
    branches: [main]
    paths: ["Web/**", ".github/workflows/web-ci.yml"]
  pull_request:
    paths: ["Web/**", ".github/workflows/web-ci.yml"]

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm test
