name: Backend CI

on:
  push:
    branches: [main]
    paths: ["Backend/**", ".github/workflows/backend-ci.yml"]
  pull_request:
    paths: ["Backend/**", ".github/workflows/backend-ci.yml"]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - run: mvn -B verify
