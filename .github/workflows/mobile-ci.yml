name: Mobile CI

on:
  push:
    branches: [develop, main, production]
    paths: ["Mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["Mobile/**", ".github/workflows/mobile-ci.yml"]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          # ghim bản: 3.50 đánh dấu package:flutter/material.dart là deprecated làm analyze fail; nâng khi chuyển sang material_ui
          flutter-version: 3.47.9
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
