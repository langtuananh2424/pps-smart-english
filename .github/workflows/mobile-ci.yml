name: Mobile CI

on:
  push:
    branches: [main]
    paths: ["Mobile/**", ".github/workflows/mobile-ci.yml"]
  pull_request:
    paths: ["Mobile/**", ".github/workflows/mobile-ci.yml"]

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Mobile
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
