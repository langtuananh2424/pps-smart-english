# Production stack: pulls images built by .github/workflows/docker-publish.yml.
# Required in .env on the server: IMAGE_PREFIX, POSTGRES_PASSWORD, REDIS_PASSWORD, JWT_SECRET, APP_BASE_URL (see .env.example).
x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pps}
      POSTGRES_USER: ${POSTGRES_USER:-pps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: redis-server --appendonly yes --maxmemory 400mb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/backend:${TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pps}
      DB_USER: ${POSTGRES_USER:-pps}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/web:${TAG:-latest}
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:80:80" # chỉ Cloudflare Tunnel cùng máy được vào, tránh giả mạo CF-Connecting-IP
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
