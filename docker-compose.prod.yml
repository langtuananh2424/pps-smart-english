# Một file cho cả staging và production: pulls images built by .github/workflows/docker-publish.yml.
# Required in .env on the server: APP_ENV, WEB_PORT, TAG, IMAGE_PREFIX, POSTGRES_PASSWORD, REDIS_PASSWORD, JWT_SECRET, APP_BASE_URL, MINIO_PORT, MINIO_ROOT_USER, MINIO_ROOT_PASSWORD, MINIO_PUBLIC_URL (see .env.example).
name: pps-english-${APP_ENV:?set APP_ENV}

x-logging: &logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-pps}
      POSTGRES_USER: ${POSTGRES_USER:-pps}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    logging: *logging
    command: redis-server --appendonly yes --maxmemory 400mb --maxmemory-policy volatile-lru --requirepass ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD}
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    logging: *logging
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:${MINIO_PORT:?set MINIO_PORT}:9000" # chỉ cloudflared cùng máy được vào; console không mở ra ngoài
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/backend:${TAG:-latest}
    restart: unless-stopped
    logging: *logging
    environment:
      DB_URL: jdbc:postgresql://db:5432/${POSTGRES_DB:-pps}
      DB_USER: ${POSTGRES_USER:-pps}
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DEMO_FLYWAY_LOCATION: ${DEMO_FLYWAY_LOCATION:-} # mặc định tắt dữ liệu demo
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:?set REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET}
      JWT_SECRET_PREVIOUS: ${JWT_SECRET_PREVIOUS:-}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      MAIL_HOST: ${MAIL_HOST:-localhost}
      MAIL_PORT: ${MAIL_PORT:-587}
      MAIL_USERNAME: ${MAIL_USERNAME:-}
      MAIL_PASSWORD: ${MAIL_PASSWORD:-}
      MAIL_FROM: ${MAIL_FROM:-no-reply@localhost}
      APP_BASE_URL: ${APP_BASE_URL:?set APP_BASE_URL}
      PAYMENT_FAKE_ENABLED: ${PAYMENT_FAKE_ENABLED:-false} # cổng giả chỉ bật để thử trên staging, production luôn false
      PAYMENT_FAKE_SECRET: ${PAYMENT_FAKE_SECRET:-}
      AI_PROVIDER: ${AI_PROVIDER:-anthropic} # anthropic bắt buộc có ANTHROPIC_API_KEY, thiếu thì backend không khởi động
      AI_MODEL: ${AI_MODEL:-claude-haiku-5-5}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY:-}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY:-}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:no-reply@localhost}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_PUBLIC_URL: ${MINIO_PUBLIC_URL:?set MINIO_PUBLIC_URL}
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER:?set MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?set MINIO_ROOT_PASSWORD}
      MINIO_BUCKET: ${MINIO_BUCKET:-pps-media}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      minio:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 30s

  web:
    image: ${IMAGE_PREFIX:?set IMAGE_PREFIX}/web:${TAG:-latest}
    restart: unless-stopped
    logging: *logging
    ports:
      - "127.0.0.1:${WEB_PORT:?set WEB_PORT}:80" # chỉ cloudflared cùng máy được vào (nginx máy chủ giữ cổng 80), tránh giả mạo CF-Connecting-IP
    depends_on:
      backend:
        condition: service_healthy

volumes:
  pgdata:
  redisdata:
  miniodata:
